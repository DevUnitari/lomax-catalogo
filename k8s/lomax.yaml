apiVersion: v1
kind: ConfigMap
metadata:
  name: lomax-config
  namespace: lomax
data:
  AWS_ENDPOINT_URL: "http://floci:4566"
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  DB_HOST: "floci"
  DB_PORT: "7001"
  DB_NAME: "postgres"
  DB_USER: "postgres"
  TABLA: "productos_atributos"
  BUCKET_ORIGINALES: "lomax-originales"
  BUCKET_MINIATURAS: "lomax-miniaturas"
  FUNCION_MINIATURAS: "miniaturas"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lomax
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      hostAliases:
        - ip: "__FLOCI_IP__"
          hostnames: ["floci"]
      containers:
        - name: api
          image: 000000000000.dkr.ecr.us-east-1.localhost:4566/lomax-backend:__TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: lomax-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lomax-secret
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lomax
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: lomax
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 000000000000.dkr.ecr.us-east-1.localhost:4566/lomax-frontend:__TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: lomax
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: lomax
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      containers:
        - name: proxy
          image: 000000000000.dkr.ecr.us-east-1.localhost:4566/lomax-proxy:__TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: lomax
spec:
  selector:
    app: proxy
  ports:
    - port: 80
      targetPort: 80
